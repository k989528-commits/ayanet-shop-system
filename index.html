
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AYANET | Shop Management</title>
    <meta name="description" content="Welcome to AYANET Shop Management System.">
    <meta name="theme-color" content="#102b50">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./admin/icon-192.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263449;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #102b50;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            font-size: 25px;
            color: #f4c542;
        }

        header span {
            font-size: 14px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            text-align: center;
        }

        .welcome {
            max-width: 650px;
            background: white;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .welcome h2 {
            color: #102b50;
            font-size: 34px;
            margin-bottom: 18px;
        }

        .welcome p {
            font-size: 17px;
            line-height: 1.7;
            color: #64748b;
            margin-bottom: 28px;
        }

        .admin-button {
            display: inline-block;
            background: #102b50;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
        }

        .admin-button:hover {
            background: #1d4779;
        }

        footer {
            background: #102b50;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <h1>AYANET</h1>
        <span>Shop Management System</span>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to AYANET</h2>

            <p>
                Your shop management system.
                Manage products, sales, stock, expenses
                and business performance in one place.
            </p>

            <a class="admin-button" href="./admin/dashboard.html">
                Admin Login
            </a>
        </section>
    </main>

    <footer>
        <p>AYANET Shop Management &copy; 2026</p>
    </footer>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./service-worker.js")
                    .catch(function (error) {
                        console.error("AYANET service worker registration failed:", error);
                    });
            });
        }
    </script>

</body>
</html>
